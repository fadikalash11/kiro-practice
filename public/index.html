<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Voice Agent</title>
    <style>
      :root {
        /* Default background colors; overridden from character.json later. */
        --bg-top: #1a0b2e;
        --bg-bottom: #4b1d6f;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* "Click to start" overlay (browsers block audio until a click). */
      #start-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(2px);
        cursor: pointer;
        z-index: 10;
        color: #fff;
        text-align: center;
        transition: opacity 0.4s ease;
      }
      #start-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #start-screen h1 {
        font-size: clamp(1.4rem, 4vw, 2.4rem);
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      #start-screen p {
        font-size: clamp(0.9rem, 2.5vw, 1.1rem);
        opacity: 0.85;
      }
      #start-btn {
        margin-top: 8px;
        padding: 12px 28px;
        font-size: 1rem;
        font-weight: 600;
        color: #1a0b2e;
        background: #fff;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }
      #start-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
      }

      /* Loading hint shown until the VRM is ready. */
      #loading {
        position: fixed;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        opacity: 0.7;
        font-size: 0.9rem;
        z-index: 5;
      }
      #loading.hidden {
        display: none;
      }

      /* Speech bubble shown above the character while it speaks. */
      #bubble {
        position: fixed;
        top: 14%;
        left: 50%;
        transform: translateX(-50%) translateY(8px);
        max-width: min(560px, 86vw);
        padding: 14px 18px;
        background: rgba(255, 255, 255, 0.96);
        color: #16203a;
        border-radius: 18px;
        font-size: clamp(0.95rem, 2.4vw, 1.15rem);
        line-height: 1.45;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        z-index: 6;
        text-align: center;
      }
      #bubble.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      #bubble::after {
        content: "";
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 10px 10px 0 10px;
        border-style: solid;
        border-color: rgba(255, 255, 255, 0.96) transparent transparent
          transparent;
      }

      /* Chat controls docked at the bottom. */
      #controls {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        gap: 10px;
        padding: 14px 16px;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.45),
          rgba(0, 0, 0, 0)
        );
        z-index: 7;
        align-items: center;
      }
      #msg {
        flex: 1;
        padding: 12px 16px;
        font-size: 1rem;
        border: none;
        border-radius: 999px;
        outline: none;
        background: rgba(255, 255, 255, 0.95);
        color: #16203a;
      }
      #controls button {
        padding: 12px 20px;
        font-size: 0.95rem;
        font-weight: 600;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        color: #16203a;
        background: #fff;
        transition: transform 0.12s ease, opacity 0.12s ease;
      }
      #controls button:hover:not(:disabled) {
        transform: translateY(-1px);
      }
      #controls button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #dance-btn {
        background: #ffd166;
      }
      #mic-btn {
        background: #8ec5ff;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #mic-btn.recording {
        background: #ff6b6b;
        color: #fff;
        animation: pulse 1s ease-in-out infinite;
      }
      #mic-btn.hidden {
        display: none;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }
    </style>

    <!-- Import map: three.js + three-vrm from CDN (no build step). -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="loading">Loading character…</div>

    <div id="bubble"></div>

    <div id="controls">
      <input
        id="msg"
        type="text"
        placeholder="Say something to the alien…"
        maxlength="500"
        autocomplete="off"
      />
      <button id="send-btn" type="button">Send</button>
      <button id="mic-btn" type="button" title="Hold to talk (or hold Space)">🎤 Hold to talk</button>
      <button id="dance-btn" type="button">Dance</button>
    </div>

    <div id="start-screen">
      <h1>👽 Character Voice Agent</h1>
      <p>Click to start — then say hello.</p>
      <button id="start-btn" type="button">Click to start</button>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
